name: Weekly AI visibility run

# Every Monday (or on demand): ask the buyer questions, save results to /data,
# and publish the report to GitHub Pages. Without any API keys it publishes the demo.
on:
  schedule:
    - cron: "41 11 * * 1"
  workflow_dispatch:
    inputs:
      samples:
        description: "Times to ask each question"
        default: "1"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Ask the questions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m aivis engines
          if [ -n "$ANTHROPIC_API_KEY$OPENAI_API_KEY$PERPLEXITY_API_KEY$GEMINI_API_KEY" ]; then
            python -m aivis run --samples "${{ github.event.inputs.samples || '1' }}"
          else
            echo "No API keys set: skipping the live run and publishing the demo only."
          fi

      - name: Build demo and site
        run: |
          python -m aivis demo --out site/demo
          if [ ! -f site/index.html ]; then cp site/demo/index.html site/index.html; fi

      - name: Commit results
        run: |
          git config user.name "aivis bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "AI visibility run $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
